<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAILEI Single Persona Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header" role="banner">
            <div class="brand">
                <span class="brand-avatar" aria-hidden="true">🎓</span>
                <div class="brand-copy">
                    <h1>HAILEI Assistant</h1>
                    <p>Your partner for course design conversations.</p>
                </div>
            </div>
            <div class="connection-summary" id="connection-summary">
                <span class="status-dot offline" id="status-dot" aria-hidden="true"></span>
                <span id="status-label">Offline</span>
            </div>
        </header>

        <main class="app-main">
            <section id="start-screen" class="start-screen" aria-labelledby="start-title">
                <div class="start-card">
                    <h2 id="start-title">Begin a new conversation</h2>
                    <p>Start a fresh thread when you’re ready to design your next learning experience.</p>
                    <button id="new-session-btn" class="primary-btn">New Session</button>
                </div>
            </section>

            <section id="build-screen" class="build-screen hidden" aria-live="polite">
                <div class="session-banner">
                    <div class="assistant-identity">
                        <span class="assistant-avatar" aria-hidden="true">🎓</span>
                        <div>
                            <h2 class="assistant-name">HAILEI Assistant</h2>
                            <p class="assistant-tagline">Single voice guidance for every step.</p>
                        </div>
                    </div>
                    <div class="session-meta">
                        <span class="session-label">Thread</span>
                        <span id="thread-badge" class="session-id">—</span>
                    </div>
                </div>

                <div class="chat-surface" role="region" aria-label="Conversation">
                    <div id="messages" class="message-log" role="log" aria-live="polite" aria-relevant="additions"></div>
                </div>

                <div id="typing-live-region" class="sr-only" aria-live="polite"></div>

                <div id="connection-banner" class="connection-banner hidden" role="status">
                    <span id="connection-banner-text"></span>
                </div>

                <form id="composer" class="composer" novalidate>
                    <label class="sr-only" for="message-input">Your message</label>
                    <textarea id="message-input" name="message" rows="3" placeholder="Type your message..." autocomplete="off" disabled required></textarea>
                    <button id="send-btn" type="submit" class="primary-btn" disabled>Send</button>
                </form>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
